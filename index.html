<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>醫新抵家｜牙科需求調查測試</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#19352d;background:#f5f8f5}*{box-sizing:border-box}body{margin:0}main{max-width:660px;margin:auto;padding:20px 16px 60px}header{padding:28px 12px;text-align:center}h1{font-size:34px;margin:0 0 8px}h2{font-size:21px;margin:0 0 15px}p{line-height:1.6}.sub{color:#587066}.notice{background:#fff7e7;border:1px solid #f0d8a6;padding:14px;border-radius:14px;font-size:15px}.panel{background:#fff;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 2px 12px #183b2a0b}.hint{color:#63796e;font-size:14px;margin-top:-6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.choice{display:flex;align-items:center;justify-content:center;text-align:center;min-height:76px;padding:12px 8px;border:2px solid #dce8df;background:#f9fbf9;border-radius:14px;font-size:17px;font-weight:650;cursor:pointer;line-height:1.4}.choice:has(input:checked){border-color:#24845c;background:#e6f5ec;color:#12543a}.choice input{position:absolute;opacity:0;pointer-events:none}.choice:focus-within{outline:3px solid #a1d8b8;outline-offset:2px}.time{display:grid;grid-template-columns:60px 1fr 1fr;align-items:center;gap:8px;margin:8px 0}.time .choice{min-height:55px;font-size:16px}.submit{width:100%;border:0;border-radius:14px;background:#227a52;color:white;font-size:20px;font-weight:700;padding:18px;cursor:pointer}.submit:disabled{background:#a7b8ae}.summary{white-space:pre-wrap;background:#eef6f0;padding:18px;border-radius:14px;line-height:1.8}.small{font-size:13px;color:#64786c;text-align:center}.hidden{display:none}button{font-family:inherit} @media(max-width:360px){.choice{font-size:15px}main{padding:12px}}
</style></head><body><main><header><h1>🦷 醫新抵家</h1><p class="sub">偏鄉牙科醫療需求調查｜測試版</p></header><div class="notice"><strong>僅供介面測試</strong>：不會儲存、上傳或寄送任何填答資料。請勿輸入真實姓名、電話或病歷資訊。此問卷不是掛號或緊急醫療服務。</div><form id="survey"><section class="panel"><h2>1. 幫誰填寫？</h2><div class="grid" id="who"></div></section><section class="panel"><h2>2. 有哪些牙齒問題？</h2><p class="hint">可以複選</p><div class="grid" id="issues"></div></section><section class="panel"><h2>3. 居住地區</h2><div class="grid" id="area"></div></section><section class="panel"><h2>4. 年齡區間</h2><div class="grid" id="age"></div></section><section class="panel"><h2>5. 性別（選填）</h2><div class="grid" id="gender"></div></section><section class="panel"><h2>6. 哪些時間方便就診？</h2><p class="hint">可複選；不代表已經預約成功</p><div id="times"></div></section><section class="panel"><h2>7. 就醫時遇到哪些困難？（選填）</h2><div class="grid" id="barriers"></div></section><section class="panel"><h2>8. 後續聯絡方式</h2><p>正式版將由衛生所評估是否提供電話聯絡。本測試版不收集電話。</p><div class="grid" id="contact"></div></section><button class="submit" type="submit">查看測試填答結果</button><p class="small">此測試網站不連接任何資料庫、Google 表單或診所 HIS。</p></form><section id="done" class="panel hidden" aria-live="polite"><h2>✓ 測試完成</h2><p>以下僅顯示在你目前裝置上，重新整理頁面後就會消失。</p><div class="summary" id="summary"></div><button class="submit" id="restart" type="button">重新填寫</button></section></main><script>
(function(){'use strict';function choices(id,name,items,multi){const root=document.getElementById(id);items.forEach((v,i)=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type=multi?'checkbox':'radio';input.name=name;input.value=v;if(!multi&&i===0&&(name==='who'||name==='area'||name==='contact'))input.checked=true;const span=document.createElement('span');span.textContent=v;label.append(input,span);root.append(label)})}choices('who','who',['我自己','幫家人或其他人'],false);choices('issues','issues',['🦷 牙齒疼痛','🍚 咀嚼困難','😁 假牙問題','🔎 牙齒檢查','🪥 洗牙保養','💬 其他問題'],true);choices('area','area',['北門區','將軍區','七股區','其他地區'],false);choices('age','age',['未滿18歲','18–64歲','65歲以上'],false);choices('gender','gender',['男性','女性','不方便回答'],false);choices('barriers','barriers',['交通不便','行動不便','缺少陪同','費用考量','不知道去哪裡','其他原因'],true);choices('contact','contact',['自行聯絡衛生所','希望衛生所聯絡（僅示意）'],false);const times=document.getElementById('times');['一','二','三','四','五'].forEach(d=>{const row=document.createElement('div');row.className='time';const day=document.createElement('strong');day.textContent='週'+d;row.append(day);['上午','下午'].forEach(t=>{const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='checkbox';input.name='times';input.value='週'+d+t;const span=document.createElement('span');span.textContent=t;label.append(input,span);row.append(label)});times.append(row)});const form=document.getElementById('survey');const val=n=>Array.from(document.querySelectorAll('input[name="'+n+'"]:checked')).map(x=>x.value);form.addEventListener('submit',e=>{e.preventDefault();if(!val('issues').length){alert('請至少選擇一項牙齒問題');document.getElementById('issues').scrollIntoView({behavior:'smooth'});return}if(!val('age').length){alert('請選擇年齡區間');document.getElementById('age').scrollIntoView({behavior:'smooth'});return}const fields=[['填寫對象','who'],['牙齒問題','issues'],['居住地區','area'],['年齡區間','age'],['性別','gender'],['方便時間','times'],['就醫困難','barriers'],['聯絡偏好','contact']];document.getElementById('summary').textContent=fields.map(([label,key])=>label+'：'+(val(key).join('、')||'未填')).join('\n');form.classList.add('hidden');document.getElementById('done').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})});document.getElementById('restart').addEventListener('click',()=>{form.reset();document.getElementById('done').classList.add('hidden');form.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})})})();
</script></body></html>
